[tool.poetry]
name = "aib-analysis"
version = "0.1.0"
description = "AI Benchmarking and Analysis"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
asyncio = "^3.4.3"
nest-asyncio = "^1.5.8"
requests = "^2.32.3"
pydantic = "^2.9.2"
scikit-learn = "^1.5.2"
plotly = ">=5.24.1,<8.0.0"
pandas = "^2.2.3"
streamlit = "^1.20.0"
scipy = "^1.16.0"
seaborn = "^0.13.2"
matplotlib = "^3.11.0"
ipykernel = "^6.29.5"
notebook = "^7.2.2"
pytest = "^8.3.2"
dotenv = "^0.9.9"
pytest-mock = "^3.14.1"
typeguard = "^4.4.3"
forecasting-tools = "0.2.47"
pendulum = "^3.1.0"
# Transitive (via aiohttp). 6.5.0 was yanked for an md.update() regression; skip it.
multidict = "!=6.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)"
]
